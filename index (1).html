<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS Agent</title>
<style>
:root{--bg:#050b14;--panel:#0b1626;--line:#16324d;--txt:#d6ecff;--dim:#6f8da8;--acc:#19e6c1;--red:#ff4d5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9f1f8;--panel:#fff;--line:#b7cbdc;--txt:#0c2236;--dim:#4d6a82;--acc:#00a88a;color-scheme:light}}
:root[data-theme="dark"]{--bg:#050b14}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;display:grid;grid-template-columns:260px 1fr 340px;gap:10px;padding:10px;overflow:hidden}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:0;display:flex;flex-direction:column}
h3{margin:0 0 8px;font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
#center{display:grid;grid-template-rows:1fr auto;gap:10px;min-height:0}
#orbbox{position:relative;align-items:center;justify-content:center}
canvas{width:100%;height:100%;display:block}
#nodes{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:8px}
.node{border:1px solid var(--acc);color:var(--acc);border-radius:8px;padding:6px 12px;font-size:11px;letter-spacing:.15em;background:transparent;cursor:pointer;text-align:left}
.node.on{background:var(--acc);color:#04131a}
#status{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.25em;color:var(--acc)}
#term{position:absolute;top:12px;right:12px;border:1px solid var(--red);color:var(--red);background:transparent;border-radius:20px;padding:6px 14px;font-size:11px;letter-spacing:.2em;cursor:pointer}
#info{height:150px;overflow:auto;font-size:13px}
#info b{color:var(--acc)}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.m{padding:8px 10px;border-radius:10px;max-width:92%;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:#0e3a4a;color:#d6ecff;border:1px solid var(--line)}
.a{align-self:flex-start;background:transparent;border:1px solid var(--line)}
.who{font-size:10px;letter-spacing:.2em;color:var(--dim);margin-bottom:2px}
#bar{display:flex;gap:6px;margin-top:8px}
#inp{flex:1;min-width:0;background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font:inherit}
.btn{background:var(--acc);color:#04131a;border:0;border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer}
#mic.rec{background:var(--red);color:#fff}
#sys div{padding:5px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:42vh 1fr;overflow:auto;height:auto;min-height:100%}
#left{display:none}#center{grid-template-rows:1fr}#info{display:none}#chat{min-height:55vh}}
</style></head><body>
<div class="card" id="left"><h3>System feed</h3><div id="sys"></div></div>

<div id="center">
 <div class="card" id="orbbox">
  <canvas id="cv"></canvas>
  <div id="nodes">
   <button class="node on" data-k="memory">MEMORY</button>
   <button class="node" data-k="skills">SKILLS</button>
   <button class="node" data-k="monitor">MONITOR</button>
   <button class="node" data-k="settings">SETTINGS</button>
  </div>
  <button id="term">TERMINATE</button>
  <div id="status">STANDBY</div>
 </div>
 <div class="card" id="info"></div>
</div>

<div class="card" id="chat">
 <h3>Assistant channel</h3>
 <div id="log"></div>
 <div id="bar">
  <input id="inp" placeholder="Type to Assistant..." autocomplete="off">
  <button class="btn" id="mic" title="Voice">🎤</button>
  <button class="btn" id="send">➤</button>
 </div>
</div>

<script>
const $=s=>document.querySelector(s);
const st={voice:true,mem:[],busy:false};
try{st.mem=JSON.parse(localStorage.getItem("jv_mem")||"[]");}catch(e){}
const saveMem=()=>{try{localStorage.setItem("jv_mem",JSON.stringify(st.mem));}catch(e){}};

/* ---------- ORB ---------- */
const cv=$("#cv"),cx=cv.getContext("2d");let W,H,pts=[],speed=.004,pulse=0;
function rs(){W=cv.width=cv.clientWidth*devicePixelRatio;H=cv.height=cv.clientHeight*devicePixelRatio}
addEventListener("resize",rs);rs();
for(let i=0;i<500;i++){const a=Math.acos(2*Math.random()-1),b=Math.random()*6.283;pts.push([Math.sin(a)*Math.cos(b),Math.cos(a),Math.sin(a)*Math.sin(b)])}
let rot=0;
function draw(){
 cx.clearRect(0,0,W,H);rot+=speed;pulse*=.95;
 const R=Math.min(W,H)*.26*(1+pulse*.12),c=Math.cos(rot),s=Math.sin(rot);
 const g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,R*1.6);
 g.addColorStop(0,"rgba(25,230,193,.35)");g.addColorStop(1,"rgba(25,230,193,0)");
 cx.fillStyle=g;cx.fillRect(0,0,W,H);
 for(const p of pts){const x=p[0]*c-p[2]*s,z=p[0]*s+p[2]*c,k=(z+1.5)/2.5;
  cx.fillStyle=`rgba(80,255,225,${.2+.8*k})`;
  cx.fillRect(W/2+x*R,H/2+p[1]*R,1.8*k*devicePixelRatio,1.8*k*devicePixelRatio)}
 requestAnimationFrame(draw)}
draw();
const setStatus=(t,sp)=>{$("#status").textContent=t;speed=sp||.004;pulse=sp?1:0};

/* ---------- LOG ---------- */
function add(role,text){
 const d=document.createElement("div");d.className="m "+(role==="u"?"u":"a");
 d.innerHTML='<div class="who">'+(role==="u"?"YOU":"JARVIS")+'</div><span></span>';
 d.lastChild.textContent=text;$("#log").appendChild(d);$("#log").scrollTop=1e9;return d.lastChild}
function sys(t){const d=document.createElement("div");d.textContent=new Date().toLocaleTimeString()+"  "+t;$("#sys").prepend(d)}

/* ---------- PANELS ---------- */
function panel(k){
 document.querySelectorAll(".node").forEach(n=>n.classList.toggle("on",n.dataset.k===k));
 const i=$("#info");
 if(k==="memory")i.innerHTML="<h3>Memory</h3>"+(st.mem.length?st.mem.map(m=>"• "+m).join("<br>"):"Empty. Say: <b>remember that I like cricket</b>");
 if(k==="skills")i.innerHTML="<h3>Skills</h3>• <b>time / date</b><br>• <b>remember …</b> / <b>forget all</b><br>• <b>open youtube / google</b><br>• <b>search for …</b><br>• anything else → AI brain";
 if(k==="monitor")i.innerHTML="<h3>Monitor</h3>Online: "+navigator.onLine+"<br>Messages: "+$("#log").children.length+"<br>Memory items: "+st.mem.length+"<br>Voice: "+(st.voice?"on":"off");
 if(k==="settings")i.innerHTML='<h3>Settings</h3><label><input type="checkbox" id="vc" '+(st.voice?"checked":"")+'> Speak replies</label><br><button class="node" id="cl" style="margin-top:8px">CLEAR CHAT</button>';
 if(k==="settings"){$("#vc").onchange=e=>{st.voice=e.target.checked;sys("voice "+(st.voice?"on":"off"))};$("#cl").onclick=()=>{$("#log").innerHTML="";sys("chat cleared")}}
}
document.querySelectorAll(".node").forEach(n=>n.onclick=()=>panel(n.dataset.k));panel("memory");

/* ---------- VOICE ---------- */
function speak(t){
 if(!st.voice||!window.speechSynthesis)return;
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
 u.onstart=()=>setStatus("SPEAKING",.03);u.onend=()=>setStatus("STANDBY");speechSynthesis.speak(u)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$("#mic").onclick=()=>{
 if(!SR){add("a","Voice input is not supported in this browser. Try Chrome.");return}
 if(rec){rec.stop();return}
 rec=new SR();rec.lang="en-IN";rec.interimResults=false;
 rec.onstart=()=>{$("#mic").classList.add("rec");setStatus("LISTENING",.015)};
 rec.onresult=e=>{const t=e.results[0][0].transcript;$("#inp").value=t;send(t)};
 rec.onerror=()=>{};rec.onend=()=>{rec=null;$("#mic").classList.remove("rec");if(!st.busy)setStatus("STANDBY")};
 rec.start()};

/* ---------- BRAIN ---------- */
function local(q){
 const l=q.toLowerCase().trim();let m;
 if(/\b(time)\b/.test(l))return"It is "+new Date().toLocaleTimeString()+".";
 if(/\b(date|today)\b/.test(l)&&!/search/.test(l))return"Today is "+new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})+".";
 if(m=l.match(/^remember (?:that )?(.+)/)){st.mem.push(m[1]);saveMem();panel("memory");return"Saved to memory: "+m[1]}
 if(/forget all/.test(l)){st.mem=[];saveMem();panel("memory");return"Memory cleared."}
 if(m=l.match(/^open (youtube|google)/)){const u=m[1]==="youtube"?"https://www.youtube.com":"https://www.google.com";window.open(u,"_blank");return"Opening "+m[1]+"."}
 if(m=l.match(/^search (?:for )?(.+)/)){window.open("https://www.google.com/search?q="+encodeURIComponent(m[1]),"_blank");return"Searching for "+m[1]+"."}
 return null}
let samplePromise=null;
async function brain(q){
 const r=local(q);if(r)return r;
 try{
  samplePromise=samplePromise||claude.use("sample");const sm=await samplePromise;
  if(sm){
   const hist=[...$("#log").querySelectorAll(".m")].slice(-8).map(d=>({role:d.classList.contains("u")?"user":"assistant",content:d.lastChild.textContent}));
   const sysTxt="You are JARVIS, a concise, witty voice assistant. Reply in 1-3 short sentences. Known facts about the user: "+(st.mem.join("; ")||"none")+". Conversation:";
   const msgs=[{role:"user",content:sysTxt+"\n"+hist.map(h=>h.role+": "+h.content).join("\n")}];
   const out=await sm(msgs,{cache:false,modelTier:"quick"});return out.text}
 }catch(e){}
 return"AI brain is offline here. I can still do: time, date, remember, open youtube, search for... (see SKILLS). To get full AI, connect an API in the Python backend."}

async function send(text){
 text=(text||$("#inp").value).trim();if(!text||st.busy)return;
 $("#inp").value="";add("u",text);st.busy=true;setStatus("THINKING",.02);sys("query: "+text.slice(0,30));
 const spot=add("a","…");
 const ans=await brain(text);spot.textContent=ans;st.busy=false;setStatus("STANDBY");speak(ans);sys("reply sent")}
$("#send").onclick=()=>send();$("#inp").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
$("#term").onclick=()=>{speechSynthesis&&speechSynthesis.cancel();setStatus("TERMINATED");sys("terminated");setTimeout(()=>setStatus("STANDBY"),1500)};
add("a","Systems online. Type or tap the mic and talk to me.");sys("boot complete");
</script></body></html>
